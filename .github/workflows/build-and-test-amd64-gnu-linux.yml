# NOTE: This file is auto-generated by tooling/generate-test-scripts.py

name: Build and Test (AMD64 GNU/Linux)

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/build-and-test-amd64-gnu-linux.yml"
      - "src/**"
      - "test/**"
      - "**/CMakeLists.txt"
      - "**.cmake"

  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/build-and-test-amd64-gnu-linux.yml"
      - "src/**"
      - "test/**"
      - "**/CMakeLists.txt"
      - "**.cmake"

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Build stage -- 4 jobs total (GCC/Clang x mpich/openmpi)
  # -----------------------------------------------------------------------
  build:
    name: Build (AMD64 GNU/Linux, ${{ matrix.compiler.name }}, ${{ matrix.image.name }})
    timeout-minutes: 180
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++, name: GCC }
          - { cc: clang, cxx: clang++, name: Clang }
        image:
          - { url: ghcr.io/zhao-shihan/rgb-docker:mpich, name: mpich }
          - { url: ghcr.io/zhao-shihan/rgb-docker:openmpi, name: openmpi }
    container:
      image: ${{ matrix.image.url }}
      options: --shm-size=2g
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build
        run: |
          . /environment
          mkdir build && cd build
          cmake -G Ninja .. \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DMUSTARD_BUILD_TESTING=ON \
            -DMUSTARD_FULL_UNITY_BUILD=ON \
            -DMUSTARD_WERROR=ON
          ninja

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-amd64-gnu-linux-${{ matrix.compiler.name }}-${{ matrix.image.name }}
          path: |
            build/test/MustardTest
            build/test/parexec.sh
            build/test/*.root
            build/test/test_file_*/
          retention-days: 1

  # -----------------------------------------------------------------------
  # Test stage -- one job per (compiler, image, test sequence)
  # -----------------------------------------------------------------------
  test:
    name: ${{ matrix.test }} (AMD64 GNU/Linux, ${{ matrix.compiler.name }}, ${{ matrix.image.name }})
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: GCC }
          - { name: Clang }
        image:
          - { url: ghcr.io/zhao-shihan/rgb-docker:mpich, name: mpich }
          - { url: ghcr.io/zhao-shihan/rgb-docker:openmpi, name: openmpi }
        test:
          - TestCLHEPXMT1993732-TestCLHEPXMT1993764-TestCLHEPXXoshiro256StarStar-TestCLHEPXXoshiro512StarStar
          - TestCreateTemporaryFile-TestCreateTemporaryFile
          - TestEstimate0-TestEstimate1-TestEstimate2-TestEstimate3-TestEstimate4-TestEstimate5-TestEstimate6-TestEstimate7-TestEstimate8-TestEstimate9-TestEstimate10-TestEstimate11-TestEstimate12-TestEstimate13-TestEstimate14-TestEstimate15-TestEstimate16-TestEstimate17-TestEstimate18-TestEstimate19-TestEstimate20-TestEstimate21-TestEstimate22-TestEstimate23-TestEstimate24-TestEstimate25-TestEstimate26-TestEstimate27-TestEstimate28-TestEstimate29-TestEstimate30-TestEstimate31-TestEstimate32-TestEstimate33
          - TestExecutor-TestExecutor
          - TestExecutorSequential
          - TestFieldTypeName
          - TestFile-TestFile
          - TestLinePointPOCA-TestLineLinePOCA-TestHelixAxisPOCA-TestHelixPointPOCA-TestHelixLinePOCA
          - TestMT1993732-TestMT1993764
          - TestMultiRDFEntryReader-TestMultiRDFEntryProcessor-TestMultiRDFEntryProcessor
          - TestMultiRDFEventReader-TestMultiRDFEventProcessor-TestMultiRDFEventProcessor
          - TestPassiveSingleton-TestPassiveSingleton
          - TestPhaseSpaceGenerator-TestPhaseSpaceGenerator
          - TestRandomNumberDistribution-TestGaussian-TestUniform
          - TestSingleRDFEntryReader-TestSingleRDFEntryProcessor-TestSingleRDFEntryProcessor
          - TestSingleRDFEventReader-TestSingleRDFEventProcessor-TestSingleRDFEventProcessor
          - TestSingleton-TestSingleton
          - TestStatistic0-TestStatistic1-TestStatistic2-TestStatistic3-TestStatistic4-TestStatistic5-TestStatistic6-TestStatistic7-TestStatistic8-TestStatistic9-TestStatistic10
          - TestVectorConcept
          - TestXoshiro256Plus-TestXoshiro256PlusPlus-TestXoshiro256StarStar-TestXoshiro512Plus-TestXoshiro512PlusPlus-TestXoshiro512StarStar
    container:
      image: ${{ matrix.image.url }}
      options: --shm-size=2g
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code (for test data and scripts)
        uses: actions/checkout@v6

      - name: Download build artifact
